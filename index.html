<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Page not found</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #111111;
        }

        .error-container {
            text-align: center;
        }

        h1 {
            font-size: 7rem;
            font-weight: 400;
            margin: 0;
            letter-spacing: -2px;
            line-height: 1;
        }

        p {
            font-size: 1.5rem;
            font-weight: 300;
            margin-top: 10px;
            color: #222222;
        }

        /* Sombra sutil inferior como en la referencia */
        .shadow {
            width: 150px;
            height: 10px;
            background: rgba(0, 0, 0, 0.06);
            border-radius: 50%;
            margin-top: 25px;
            filter: blur(4px);
        }
    </style>
</head>
<body>

    <div class="error-container">
        <h1>404</h1>
        <p>Page not found</p>
        <div class="shadow"></div>
    </div>

</body>
</html>
